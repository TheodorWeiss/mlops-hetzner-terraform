name: bikeml deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted          # ← ключевое изменение: выполняется на сервере
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: sync code into runtime folder
        run: |
          set -e
          rsync -a \
            api airflow scripts sql docker-compose.yml \
            /home/deploy/mlops-stack/

      - name: validate
        run: |
          set -e
          cd /home/deploy/mlops-stack
          python3 -m py_compile api/app/main.py
          python3 -m py_compile scripts/*.py
          python3 -m py_compile airflow/dags/*.py
          docker compose -p bikeml config > /dev/null

      - name: restart code services
        run: |
          set -e
          cd /home/deploy/mlops-stack
          docker compose -p bikeml up -d api airflow-webserver airflow-scheduler
          sleep 10
          curl --fail http://127.0.0.1:8000/health
          docker compose -p bikeml ps api airflow-webserver airflow-scheduler
