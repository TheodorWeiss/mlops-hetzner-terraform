services:
  postgres:
    image: postgres:16
    container_name: bikeml-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ${POSTGRES_DATA_DIR}:/var/lib/postgresql/data
      - ./sql/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - bikeml-net

  minio:
    image: minio/minio:latest
    container_name: bikeml-minio
    restart: unless-stopped
    env_file:
      - .env
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ${MINIO_DATA_DIR}:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - bikeml-net

  create-minio-buckets:
    image: minio/mc:latest
    container_name: bikeml-create-minio-buckets
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - .env
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb -p local/${MINIO_BUCKET_RAW} || true;
      mc mb -p local/${MINIO_BUCKET_PROCESSED} || true;
      mc mb -p local/${MINIO_BUCKET_MODELS} || true;
      mc mb -p local/${MINIO_BUCKET_REPORTS} || true;
      mc ls local;
      "
    networks:
      - bikeml-net

  redis:
    image: redis:7
    container_name: bikeml-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - bikeml-net

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    container_name: bikeml-mlflow
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      create-minio-buckets:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    command: >
      bash -c "
      pip install --no-cache-dir psycopg2-binary boto3 &&
      mlflow server
      --backend-store-uri postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${MLFLOW_DB}
      --default-artifact-root s3://${MLFLOW_ARTIFACT_BUCKET}/
      --host 0.0.0.0
      --port 5000
      "
    ports:
      - "127.0.0.1:5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\""]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 60s
    networks:
      - bikeml-net

  airflow-init:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    image: bikeml-airflow:2.10.3-python3.11
    container_name: bikeml-airflow-init
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${AIRFLOW_DB}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__WEBSERVER__SECRET_KEY: bikeml_airflow_secret_key_change_later
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      _AIRFLOW_WWW_USER_EMAIL: ${AIRFLOW_ADMIN_EMAIL}
      _AIRFLOW_WWW_USER_FIRSTNAME: BikeML
      _AIRFLOW_WWW_USER_LASTNAME: Admin
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/include:/opt/airflow/include
      - ./airflow/requirements.txt:/requirements.txt
      - ${AIRFLOW_DATA_DIR}/logs:/opt/airflow/logs
      - ${INCOMING_RAW_DIR}:/mnt/mlops-data/incoming-raw
      - ${PROCESSED_DATA_DIR}:/mnt/mlops-data/processed-data
      - ./scripts:/opt/airflow/scripts:ro
      - /mnt/mlops-data/airflow/ssh/bikeml_ingestion_read:/opt/airflow/.ssh/bikeml_ingestion_read:ro
    entrypoint: /bin/bash
    command:
      - -c
      - |
        if [ -s /requirements.txt ]; then
          pip install --no-cache-dir -r /requirements.txt
        fi
        airflow db migrate
        airflow users create \
          --username "${AIRFLOW_ADMIN_USER}" \
          --password "${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname BikeML \
          --lastname Admin \
          --role Admin \
          --email "${AIRFLOW_ADMIN_EMAIL}" || true
    networks:
      - bikeml-net

  airflow-webserver:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    image: bikeml-airflow:2.10.3-python3.11
    container_name: bikeml-airflow-webserver
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${AIRFLOW_DB}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__WEBSERVER__SECRET_KEY: bikeml_airflow_secret_key_change_later
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/include:/opt/airflow/include
      - ./airflow/requirements.txt:/requirements.txt
      - ${AIRFLOW_DATA_DIR}/logs:/opt/airflow/logs
      - ${INCOMING_RAW_DIR}:/mnt/mlops-data/incoming-raw
      - ${PROCESSED_DATA_DIR}:/mnt/mlops-data/processed-data
      - ./scripts:/opt/airflow/scripts:ro
      - /mnt/mlops-data/airflow/ssh/bikeml_ingestion_read:/opt/airflow/.ssh/bikeml_ingestion_read:ro
    command: webserver
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\" || curl --fail http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - bikeml-net

  airflow-scheduler:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    image: bikeml-airflow:2.10.3-python3.11
    container_name: bikeml-airflow-scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${AIRFLOW_DB}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__WEBSERVER__SECRET_KEY: bikeml_airflow_secret_key_change_later
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/include:/opt/airflow/include
      - ./airflow/requirements.txt:/requirements.txt
      - ${AIRFLOW_DATA_DIR}/logs:/opt/airflow/logs
      - ${INCOMING_RAW_DIR}:/mnt/mlops-data/incoming-raw
      - ${PROCESSED_DATA_DIR}:/mnt/mlops-data/processed-data
      - ./scripts:/opt/airflow/scripts:ro
      - /mnt/mlops-data/airflow/ssh/bikeml_ingestion_read:/opt/airflow/.ssh/bikeml_ingestion_read:ro
    command: scheduler
    networks:
      - bikeml-net

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: bikeml-api:0.1.0
    container_name: bikeml-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      BIKEML_DB: bikeml
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LOW_AVAILABILITY_THRESHOLD: 1
      STALE_STATE_SECONDS: 900
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - bikeml-net

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: bikeml-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${PROMETHEUS_DATA_DIR:-/mnt/mlops-data/prometheus}:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      api:
        condition: service_healthy
      postgres-exporter:
        condition: service_started
      blackbox-exporter:
        condition: service_started
    networks:
      - bikeml-net

  grafana:
    image: grafana/grafana:11.3.1
    container_name: bikeml-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_VIEWERS_CAN_EDIT: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_AUTH_ANONYMOUS_HIDE_VERSION: "true"
    volumes:
      - ${GRAFANA_DATA_DIR:-/mnt/mlops-data/grafana}:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_started
    networks:
      - bikeml-net

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: bikeml-node-exporter
    restart: unless-stopped
    command:
      - "--path.rootfs=/host"
    volumes:
      - /:/host:ro,rslave
    networks:
      - bikeml-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: bikeml-cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - bikeml-net

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: bikeml-postgres-exporter
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bikeml-net

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: bikeml-blackbox-exporter
    restart: unless-stopped
    volumes:
      - ./monitoring/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    command:
      - "--config.file=/etc/blackbox_exporter/config.yml"
    networks:
      - bikeml-net


networks:
  bikeml-net:
    name: bikeml-net
